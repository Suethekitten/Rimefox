<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>凛狐</title>
    <script src="../lib/ui-theme-boot.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="logo" src="../icons/icon48.png" alt="" width="30" height="30" />
      <div class="brand">
        <div class="name">凛狐</div>
        <div class="tagline">双语对照翻译 · Rimefox</div>
      </div>
      <span class="ver" id="ver"></span>
      <button
        type="button"
        id="themeToggle"
        class="theme-toggle"
        data-next="dark"
        title="切换到深色"
        aria-label="切换到深色"
      >
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" /></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
      </button>
    </header>

    <main class="main">
      <button id="toggle" class="primary">翻译此页</button>

      <!-- data-state：idle / busy / on / error / unsupported，由 popup.js 设置 -->
      <div class="status" id="statusBox" data-state="idle">
        <span class="status-dot" aria-hidden="true"></span>
        <div class="status-body">
          <div class="stat" id="stat">检测中…</div>
          <div class="progress" id="progress" hidden><span id="progressBar"></span></div>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <span class="label">显示</span>
          <div class="seg" id="modeSeg">
            <button type="button" data-mode="dual" class="active">双语对照</button>
            <button type="button" data-mode="translation">仅译文</button>
          </div>
        </div>
        <div class="row">
          <span class="label">译成</span>
          <select id="target"></select>
        </div>
        <!-- 趣味翻译：只对当前页生效，还原后回到普通 -->
        <div class="row">
          <span class="label" title="只改写正文，只对当前页生效；还原后回到普通翻译">趣味</span>
          <div class="seg" id="styleSeg"></div>
        </div>
      </div>

      <section class="card quick">
        <div class="card-title">随手翻译</div>
        <textarea id="quickInput" rows="3" placeholder="粘贴 / 输入要翻译的文字…（Ctrl+Enter 翻译）"></textarea>
        <div class="quick-actions">
          <button type="button" id="quickGo" class="mini primary-mini">翻译</button>
          <button type="button" id="quickCopy" class="mini">复制结果</button>
          <button type="button" id="quickClear" class="mini">清空</button>
        </div>
        <div id="quickOut" class="quick-out" hidden></div>
      </section>
    </main>

    <footer class="foot">
      <button type="button" id="retranslate" class="link">重新翻译</button>
      <button type="button" id="clearCache" class="link">清缓存</button>
      <button type="button" id="diagnose" class="link">诊断</button>
      <button type="button" id="openOptions" class="link">设置</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
