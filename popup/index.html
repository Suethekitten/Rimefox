<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>凛狐</title>
    <script src="../lib/ui-theme-boot.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- 1. 紧凑顶栏：品牌 + 版本 + 界面语言 + 深浅色 -->
    <header class="head">
      <img class="logo" src="../icons/icon48.png" alt="" width="26" height="26" />
      <div class="brand">
        <div class="name">凛狐</div>
        <div class="tagline">双语对照翻译 · Rimefox</div>
      </div>
      <span class="ver" id="ver"></span>
      <button type="button" id="langToggle" class="icon-btn" title="切换界面语言" aria-label="切换界面语言">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></svg>
      </button>
      <button
        type="button"
        id="themeToggle"
        class="icon-btn theme-toggle"
        data-next="dark"
        title="切换到深色"
        aria-label="切换到深色"
      >
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" /></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
      </button>
    </header>

    <main class="main">
      <!-- 2. 状态英雄卡：状态行 + 流光进度 + 主按钮（内嵌快捷键）+ 服务商尾注。
           data-state：idle / busy / on / error / unsupported，由 popup.js 设置 -->
      <section class="hero" id="statusBox" data-state="idle">
        <div class="hero-row">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="hero-title" id="statusTitle" role="status">检测中…</span>
          <span class="hero-count" id="statusCount" hidden></span>
        </div>
        <div class="progress" id="progress" hidden><span id="progressBar"></span></div>
        <div class="stat" id="stat"></div>
        <button type="button" id="toggle" class="primary">
          <svg class="primary-ico ico-go" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9M8.5 3v2M6 5c.6 3.4 2.9 6.2 6 7.5M11 5c-.7 3.6-3.4 6.6-7 8" /><path d="M13 21l4-9 4 9M14.5 18h5" /></svg>
          <svg class="primary-ico ico-undo" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
          <svg class="primary-ico ico-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2" /></svg>
          <span class="primary-label" id="toggleLabel">翻译此页</span>
          <kbd class="primary-kbd" id="toggleKbd" hidden></kbd>
        </button>
        <button type="button" class="hero-foot" id="heroFoot" title="当前服务商和模型">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" /></svg>
          <span class="status-meta" id="meta"></span>
          <span class="hero-go">去设置 →</span>
        </button>
      </section>

      <!-- 3–5. 显示方式分段控制器 + 2×2 紧凑矩阵（译成 / 趣味 / 悬停对照 / 本站夜间） -->
      <section class="card controls">
        <div class="seg" id="modeSeg" role="group" aria-label="显示">
          <button type="button" data-mode="dual" class="active">双语对照</button>
          <button type="button" data-mode="translation">仅译文</button>
        </div>
        <div class="pair">
          <label class="field">
            <span class="field-label">译成</span>
            <select id="target"></select>
          </label>
          <!-- 趣味翻译：选择会保留，只对当前页生效，下次明确翻译时应用 -->
          <label class="field field-style" title="只改写正文，只对当前页生效；选择会保留，切换下拉框不会立即重译，下次明确翻译时生效">
            <span class="field-label">趣味</span>
            <select id="styleSelect"></select>
          </label>
        </div>
        <div class="pair tiles">
          <label class="tile" id="hoverRow" title="悬停时显示对应原句；无法准确匹配时回退到行或段落。可在网页悬浮入口中快速开关。">
            <svg class="tile-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg>
            <span class="tile-label">悬停对照</span>
            <input type="checkbox" id="hoverCompare" role="switch" />
            <span class="switch switch-sm" aria-hidden="true"></span>
          </label>
          <!-- 网页夜间模式（Beta）：只对当前网站开关，名单在设置页「站点与兼容性」 -->
          <label class="tile" id="nightRow" hidden>
            <svg class="tile-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" /></svg>
            <span class="tile-label">本站夜间</span>
            <span class="night-host" id="nightHost"></span>
            <input type="checkbox" id="nightSite" role="switch" />
            <span class="switch switch-sm" aria-hidden="true"></span>
          </label>
        </div>
        <label class="tile medical-tile" id="medicalRow" title="优先使用已审核的医学术语；保留剂量、统计结果和临床结论">
          <svg class="tile-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18" /><circle cx="12" cy="12" r="5" /></svg>
          <span class="tile-label">医学专业模式</span>
          <input type="checkbox" id="medicalMode" role="switch" />
          <span class="switch switch-sm" aria-hidden="true"></span>
        </label>
      </section>

      <!-- 6. 随手翻译：默认一行，聚焦 / 有内容 / 有结果时展开 -->
      <section class="card quick">
        <div class="quick-field">
          <svg class="quick-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <textarea id="quickInput" rows="1" placeholder="随手翻译：粘贴或输入文字…" aria-label="随手翻译"></textarea>
          <kbd class="quick-kbd" id="quickKbd">Ctrl+Enter</kbd>
        </div>
        <div class="quick-actions">
          <button type="button" id="quickGo" class="mini primary-mini">开始翻译</button>
          <button type="button" id="quickClear" class="mini">清空</button>
          <span class="quick-target" id="quickTarget"></span>
        </div>
        <div class="quick-result">
          <div id="quickOut" class="quick-out" hidden></div>
          <button type="button" id="quickCopy" class="copy-btn" title="复制结果" aria-label="复制结果">
            <svg class="ico-copy" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V6a2 2 0 0 1 2-2h8" /></svg>
            <svg class="ico-check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>
            <span class="copy-done">已复制</span>
          </button>
        </div>
      </section>
    </main>

    <!-- 7. 底部液态玻璃工具坞：5 个动作按钮 + 会折射的透镜（见 lib/liquid-glass/） -->
    <footer class="foot" id="glassDock" role="toolbar" aria-label="快捷操作">
      <button type="button" id="openReader" class="link" title="打开 EPUB 阅读器">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z" /><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5M8 7h8M8 11h6" /></svg>
        <span>EPUB</span>
      </button>
      <button type="button" id="retranslate" class="link" title="重新翻译">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 4v7h-7" /></svg>
        <span>重新翻译</span>
      </button>
      <button type="button" id="clearCache" class="link" title="清缓存">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3" /><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" /></svg>
        <span>清缓存</span>
      </button>
      <button type="button" id="diagnose" class="link" title="诊断">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6h4" /></svg>
        <span>诊断</span>
      </button>
      <button type="button" id="openGuide" class="link" title="指南">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5Z" /><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5" /></svg>
        <span>指南</span>
      </button>
      <button type="button" id="openOptions" class="link" title="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></svg>
        <span>设置</span>
      </button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
