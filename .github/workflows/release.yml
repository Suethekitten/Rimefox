# 自动发布 Release
#
# 触发：推送到 main 且改动了 manifest.json（通常就是改了版本号），或在 Actions 页面手动运行。
# 同一个版本只发一次：v<版本号> 已经有 Release 就直接跳过，所以普通推送不会重复发版。
#
# 流程：校验版本号 → 发版说明格式 → 全部 Node 单测 → 离线自检 → 打包（与商店包同一份白名单）→ 检查安装包清单
#       → 从 CHANGELOG 摘出这一版的说明 → 发 Release。任何一步失败，后面的步骤（包括发 Release）都不执行
name: Release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/release.yml
      # 测试 / 自检改动也要重新校验：0.9.4 的教训是自检用例只在 CI 上失败
      - selftest/**
      - test/**
  workflow_dispatch:

permissions:
  contents: write # 创建 tag 和 Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 第三方 Action 钉到 commit SHA（标签可以被改指向，SHA 不能）；升级时一起改后面的版本注释
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # 发布用的是下面的 GH_TOKEN，不需要把令牌留在 git 配置里

      - name: 读取并校验版本号
        id: ver
        run: |
          VERSION=$(jq -r .version manifest.json)
          CORE=$(grep -oP "DT\.VERSION = '\K[^']+" content/core.js)
          PKG=$(jq -r .version package.json)
          if [ "$VERSION" != "$CORE" ] || [ "$VERSION" != "$PKG" ]; then
            echo "::error::版本号不一致：manifest.json $VERSION / content/core.js $CORE / package.json $PKG"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: 这个版本发过了就跳过
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" > /dev/null 2>&1; then
            echo "${{ steps.ver.outputs.tag }} 已经有 Release，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 发版说明格式（规则见 AGENTS.md「发版说明」）：每版 3–6 条、每条一句话 ≤ 90 字、不许子项、只写用户能感觉到的变化
      - name: 检查更新说明格式
        if: steps.check.outputs.skip == 'false'
        run: python3 tools/check-release-notes.py "${{ steps.ver.outputs.version }}"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 24

      # 全部 Node 单测（字幕竞态、悬停配置、用量统计、打包……）。node --test 把每个 test/*.test.mjs 放进
      # 单独的子进程，按退出码判定（失败时脚本 process.exit(1) / 抛异常），不看输出里有没有「通过」字样
      - name: 跑 Node 单测
        if: steps.check.outputs.skip == 'false'
        run: |
          node --version
          node --test --test-reporter=spec test/*.test.mjs

      # 自检页是纯前端页面，不需要加载扩展：用无头 Chrome 打开 file:// 地址，读出结果
      - name: 跑离线自检
        if: steps.check.outputs.skip == 'false'
        run: |
          google-chrome --headless=new --no-sandbox --allow-file-access-from-files \
            --virtual-time-budget=5000 --dump-dom "file://$PWD/selftest/index.html" > "$RUNNER_TEMP/selftest.html" 2> /dev/null
          SUMMARY=$(grep -oP 'id="summary"[^>]*>\K[^<]+' "$RUNNER_TEMP/selftest.html" || true)
          echo "自检结果：$SUMMARY"
          if ! echo "$SUMMARY" | grep -q '全部通过'; then
            echo "::error::自检没有全部通过（$SUMMARY），不发布"
            exit 1
          fi

      # 安装包和商店包用 tools/package-store.mjs 的同一份白名单：只收运行时文件和许可文件，
      # 测试、自检页、开发文档、商店截图都不进用户下载的 zip（0.8.5 以前是 rsync 整仓再排除几项）。
      # 脚本自己会校验版本号、图标、manifest 引用的文件、欢迎页和许可文件，缺一个就失败。
      # zip 里的文件夹名固定叫 Rimefox：已解压扩展的 ID 跟文件夹路径绑定，
      # 用户升级时把新版本覆盖到同一个文件夹再点"重新加载"，设置（包括 API Key）就不会丢
      - name: 打包
        if: steps.check.outputs.skip == 'false'
        id: pack
        run: |
          node tools/package-store.mjs --release | tail -1
          node tools/package-store.mjs | tail -1
          echo "zip=dist/Rimefox-${{ steps.ver.outputs.tag }}.zip" >> "$GITHUB_OUTPUT"
          echo "store=dist/Rimefox-${{ steps.ver.outputs.tag }}-store.zip" >> "$GITHUB_OUTPUT"

      - name: 检查安装包清单
        if: steps.check.outputs.skip == 'false'
        run: |
          REL="${{ steps.pack.outputs.zip }}"
          STORE="${{ steps.pack.outputs.store }}"
          unzip -tq "$REL"
          unzip -tq "$STORE"
          unzip -Z1 "$REL" | sort > "$RUNNER_TEMP/release.lst"
          unzip -Z1 "$STORE" | sed 's#^#Rimefox/#' | sort > "$RUNNER_TEMP/store.lst"
          # 与商店包的文件集合必须一致（只差一层 Rimefox/ 文件夹）
          if ! diff -u "$RUNNER_TEMP/store.lst" "$RUNNER_TEMP/release.lst"; then
            echo "::error::Release 包与商店包的文件不一致"
            exit 1
          fi
          # 不能带测试 / 自检页 / 开发文档 / 商店截图 / 工具脚本
          if grep -E '^Rimefox/(test|selftest|docs|tools|dist|\.github)/|^Rimefox/[^/]+\.md$|^Rimefox/package\.json$' "$RUNNER_TEMP/release.lst" | grep -v '^Rimefox/THIRD-PARTY-NOTICES\.md$'; then
            echo "::error::Release 包里混进了非运行时文件（见上面列出的路径）"
            exit 1
          fi
          # 许可文件必须随包分发
          for f in manifest.json LICENSE THIRD-PARTY-NOTICES.md licenses/oneaifw-MIT.txt; do
            if ! grep -qx "Rimefox/$f" "$RUNNER_TEMP/release.lst"; then
              echo "::error::Release 包缺少 $f"
              exit 1
            fi
          done
          echo "安装包 $(wc -l < "$RUNNER_TEMP/release.lst") 个文件，$(wc -c < "$REL") B"

      - name: 整理更新说明
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # CHANGELOG 里 "## <版本号> — 标题" 到下一个 "## " 之间就是这一版的说明
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md 里没有 $VERSION 的说明。" > "$RUNNER_TEMP/notes.md"
          fi
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ---

          **安装**：下载下面的 zip 并解压 → 打开 `chrome://extensions/`（Edge：`edge://extensions/`）→ 开启开发者模式 → 「加载已解压的扩展程序」→ 选择解压出来的 `Rimefox` 文件夹。

          **升级**：把新版本解压后覆盖原来的 `Rimefox` 文件夹，再在扩展管理页点「重新加载」。文件夹路径不变，设置和 API Key 都会保留。
          EOF

      - name: 发布 Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" "${{ steps.pack.outputs.zip }}" \
            --title "凛狐 Rimefox ${{ steps.ver.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"
