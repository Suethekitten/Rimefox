<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Control matrix</title>
<style>body{font:16px/1.6 -apple-system,sans-serif;margin:24px;max-width:820px}
h4{font-size:1rem;margin:12px 0} button{font:inherit;background:#eee;border:1px solid #ccc;padding:4px 8px;cursor:pointer}</style></head><body>
<h1>Control embedding matrix</h1>

<h4 id="v1h"><button id="v1b" aria-expanded="false"><h2 id="v1h2">V1 heading wraps button wraps h2 question</h2></button></h4>

<h4 id="v2h"><button id="v2b">V2 heading wraps button text directly</button></h4>

<div><button id="v3b"><h2 id="v3h2">V3 div wraps button wraps h2 question</h2></button></div>

<div><button id="v4b"><span id="v4s">V4 div wraps button wraps span label</span></button></div>

<div role="button" tabindex="0" id="v5">V5 div role=button text</div>

<h4 id="v6h"><span role="button" tabindex="0" id="v6">V6 heading wraps span role=button</span></h4>

<li id="v7l"><button id="v7b">V7 li wraps button text</button></li>

<p id="v8p">V8 paragraph wraps <button id="v8b">button text</button> inline.</p>

<h4 id="v9h"><a href="#x" id="v9a">V9 heading wraps anchor text</a></h4>

<div id="v10"><summary id="v10s">V10 div wraps summary text</summary></div>

<h4 id="v11h"><button id="v11b"><span id="v11s">V11 heading button span label</span><svg width="12" height="12" aria-hidden="true"></svg></button></h4>
<div id="hiddenwrap" style="display:none"><button id="hiddenb">Hidden button must not translate</button></div>
<p id="notr">Visible <span class="notranslate">KeepMe</span> text remains.</p>
<p id="labmix">Choose <label id="labx">this option</label> now.</p>
</body></html>
