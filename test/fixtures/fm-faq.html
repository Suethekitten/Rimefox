<!doctype html><html lang="en"><head><meta charset="utf-8"><title>FM FAQ fixture</title>
<style>
body{font:16px/1.6 -apple-system,sans-serif;margin:24px;max-width:820px}
.sc-bdVaJa{box-sizing:border-box;margin:0;min-width:0}
h2.jlSKsX{font-size:1rem;font-weight:500;line-height:1.75rem;letter-spacing:-.2px;color:#4E4E4E;margin:0}
button.ckwEgb{box-sizing:border-box;appearance:none;display:inline-block;text-align:left;line-height:inherit;border:0;background:none;cursor:pointer;width:100%;padding:8px 0}
.carrot{transition:transform 300ms}
button[aria-expanded="true"] .carrot{transform:rotate(180deg)}
</style></head><body>
<h1>Frequently Asked Questions</h1>
<h4 data-testid="headerWrapper">
  <button data-testid="What’s included in Freedom Mobile’s Roam Beyond Travel Data eSIM? " data-type="accordion" aria-expanded="false" id="fmbtn" class="ckwEgb">
    <div class="sc-bdVaJa"><div class="sc-bdVaJa"><div class="sc-bdVaJa"><div class="sc-bdVaJa">
      <h2 id="fmq" class="jlSKsX">What’s included in Freedom Mobile’s Roam Beyond Travel Data eSIM?</h2>
    </div></div></div>
    <div class="carrot" id="fmcarrot"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="#333"/></svg></div>
  </button>
</h4>
<div id="fmpanel" hidden><p id="fmans">The plan includes 5GB of data in over 100 destinations, plus unlimited calls and texts within Canada.</p></div>

<h2>Other control shapes</h2>
<button id="plainbtn" type="button">Show delivery details</button>
<details id="det"><summary id="sum">How do I activate the eSIM?</summary><p id="detbody">Activation happens in the app after purchase.</p></details>
<div role="button" tabindex="0" id="rolebtn">Can I keep my number?</div>
<button id="spanbtn" type="button"><span id="spanlabel">What about roaming charges?</span></button>
<button id="svgbtn" type="button"><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="#ccc"/></svg><span id="svglabel">Is there a fair usage limit?</span></button>
<my-accordion><div role="button" tabindex="0" id="reactbtn"><span id="reactlabel">Will my existing plan change?</span></div></my-accordion>
<script>
document.getElementById('fmbtn').addEventListener('click', function () {
  var open = this.getAttribute('aria-expanded') === 'true';
  this.setAttribute('aria-expanded', open ? 'false' : 'true');
  document.getElementById('fmpanel').hidden = open;
});
document.getElementById('plainbtn').addEventListener('click', function () { window.__plainClicks = (window.__plainClicks || 0) + 1; });
document.getElementById('det').addEventListener('toggle', function () { window.__detToggles = (window.__detToggles || 0) + 1; });
document.getElementById('rolebtn').addEventListener('click', function () { window.__roleClicks = (window.__roleClicks || 0) + 1; });
document.getElementById('rolebtn').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.click(); } });
</script>
</body></html>
